services:
  app:
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE must be set}
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sw_be}
      DB_USERNAME: ${DB_USERNAME:-swbe}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?FRONTEND_ORIGINS must be set}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      FILE_STORAGE_PROVIDER: S3
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
      CLOUDFRONT_BASE_URL: ${CLOUDFRONT_BASE_URL:?CLOUDFRONT_BASE_URL must be set}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
        restart: true

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sw_be}
      MYSQL_USER: ${DB_USERNAME:-swbe}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - swbe_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  swbe_mysql_data:
