services:
  app:
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE must be set}
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sw_be}
      DB_USERNAME: ${DB_USERNAME:-swbe}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
        restart: true

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sw_be}
      MYSQL_USER: ${DB_USERNAME:-swbe}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - swbe_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  swbe_mysql_data:
